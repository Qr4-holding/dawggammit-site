# DAWG GAMMIT site + shop admin, as deployed on the Hostinger VPS (Docker manager project "dawggammit").
# Project environment (set on the server only, never in this repo):
#   SITE_HOSTS     = the main domains Caddy serves the site on, e.g. "dawggammit.com, www.dawggammit.com"
#   MAIN_HOST      = the one address every other domain redirects to, e.g. "dawggammit.com"
#   REDIRECT_HOSTS = extra domains that permanently redirect to MAIN_HOST, e.g. "dawggamit.com, www.dawggamit.com"
#   ADMIN_PASSWORD = the password for dawggammit.com/admin (sign-in is off when empty)
#   SESSION_SECRET = a long random string that signs admin sign-ins
#   ELEVENLABS_API_KEY = Robert's ElevenLabs key: the video studio records per-product voiceovers in the Andray voice (optional)
# Shop data and uploaded photos live in the "data" volume, so they survive restarts and updates.
# Video studio (dawggammit.com/admin/videos): the "studio" service renders the promo videos. It shares the data volume
# with the site; private music, voice cuts and backgrounds live there in studio-library/, uploaded through the admin.
# Updating the code: push to main, then restart the project (the containers clone main on start).
services:
  web:
    image: node:22-alpine
    command: ["sh", "-c", "apk add --no-cache git >/dev/null && rm -rf /src && git clone --depth 1 https://github.com/Qr4-holding/dawggammit-site.git /src && cd /src/app && npm install --omit=dev --no-audit --no-fund && exec node server.js"]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - ELEVENLABS_API_KEY_SET=${ELEVENLABS_API_KEY:+yes}
    volumes:
      - data:/data
    labels:
      caddy: ${SITE_HOSTS}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.encode: gzip
      # Some home and mobile networks drop large HTTP/3 (QUIC) packets, so photos stall half-loaded.
      # "clear" tells browsers to use ordinary HTTPS (HTTP/2) for this site only.
      caddy.header: "Alt-Svc clear"
      caddy_1: ${REDIRECT_HOSTS}
      caddy_1.redir: "https://${MAIN_HOST}{uri} permanent"
      caddy_1.header: "Alt-Svc clear"
    networks:
      - web
    restart: unless-stopped
  studio:
    # Chrome, Node and the system libraries the video renderer needs come with this image.
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    command:
      - sh
      - -c
      - |
        set -e
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends git ffmpeg python3-numpy python3-scipy python3-pil >/dev/null
        rm -rf /src
        git clone --depth 1 https://github.com/Qr4-holding/dawggammit-site.git /src
        exec python3 -u /src/studio/worker.py
    environment:
      - DATA_DIR=/data
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
    volumes:
      - data:/data
      - studio-cache:/root/.cache
      - studio-npm:/root/.npm
    cpus: 1.5
    mem_limit: 3g
    restart: unless-stopped
networks:
  web:
    external: true
volumes:
  data: {}
  studio-cache: {}
  studio-npm: {}
